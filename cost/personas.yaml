# Mô phỏng chi phí khi dùng thật — guide 4.2. Số không có nguồn ghi "(tự ước tính)".
# Chạy: python run.py simulate --try   (10 phiên)  ·  python run.py simulate  (bản nộp)

sessions: 50
seed: 42

users:
  low: 1000
  base: 5000
  high: 20000
  source: "(tự ước tính) quy mô thí điểm: thấp = 1 phòng khám/công ty dùng cho đợt khám sức khỏe định kỳ; cơ sở = 5.000 người (khớp spec §2); cao = 20.000 người khi tích hợp vào app khám định kỳ. Chưa có nguồn công khai cho số người dùng của sản phẩm này."

personas:
  - name: mot_lan_sau_kham
    share: 0.6
    uses_per_month: 1
    turns_per_session: 2
    source: "(tự ước tính) người vừa có kết quả khám định kỳ, hỏi 1 lần, thêm 1 câu hỏi lại (lúc đo/đơn vị)"
    types: [thuong, kho]
  - name: tu_do_tai_nha
    share: 0.3
    uses_per_month: 4
    turns_per_session: 2
    source: "(tự ước tính) người tự mua máy đo (vd evidence q/5533, q/3032), hỏi khoảng 1 lần/tuần"
    types: [thuong, kho]
  - name: hoi_ho_nguoi_than
    share: 0.1
    uses_per_month: 2
    turns_per_session: 3
    source: "(tự ước tính) con cháu hỏi hộ cha mẹ (vd B11), hay hỏi thêm về thuốc nên có câu từ chối"
    types: [thuong, kho, tu_choi]

